<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7b8d5">
<title>♡</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#f7b8d5;image-rendering:pixelated}
.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(145deg,#f9c9df 0%,#f5a9ce 55%,#e995c1 100%);transition:filter .8s}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(174,76,132,.12) 100%)}
.sky-stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:6px;height:6px;background:#fff7fb;box-shadow:0 0 0 2px rgba(255,255,255,.16);clip-path:polygon(33% 0,66% 0,66% 33%,100% 33%,100% 66%,66% 66%,66% 100%,33% 100%,33% 66%,0 66%,0 33%,33% 33%);animation:blink 2.4s steps(2) infinite}
.star.big{width:10px;height:10px;background:#fff0b8}
.star.dim{opacity:.55;transform:scale(.65)}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.letter{position:absolute;z-index:3;left:50%;top:50%;width:112px;height:82px;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;cursor:pointer;filter:drop-shadow(4px 7px 0 rgba(143,57,111,.2));animation:float 7s ease-in-out infinite}
@keyframes float{0%{transform:translate(-50%,-50%) translate(-30vw,-17vh) rotate(-9deg)}25%{transform:translate(-50%,-50%) translate(25vw,-24vh) rotate(7deg)}50%{transform:translate(-50%,-50%) translate(32vw,20vh) rotate(10deg)}75%{transform:translate(-50%,-50%) translate(-24vw,25vh) rotate(-7deg)}100%{transform:translate(-50%,-50%) translate(-30vw,-17vh) rotate(-9deg)}}
.letter:hover{filter:drop-shadow(5px 9px 0 rgba(143,57,111,.23)) brightness(1.04)}
.envelope{position:absolute;inset:9px 3px 2px;background:#fff0d7;border:4px solid #b96b88;box-shadow:inset 0 -5px #f5c8c8,inset 0 0 0 3px #fff9ed}
.envelope:before{content:"";position:absolute;z-index:2;left:-4px;right:-4px;top:-4px;height:48px;background:#f9dce0;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px #b96b88)}
.envelope:after{content:"";position:absolute;z-index:3;inset:0;background:#f7d6d9;clip-path:polygon(0 100%,0 0,50% 51%,100% 0,100% 100%);opacity:.92}
.seal{position:absolute;z-index:4;left:50%;top:48%;width:13px;height:13px;background:#e65d91;transform:translate(-50%,-50%) rotate(45deg);box-shadow:2px 2px 0 #b74479}
.seal:before,.seal:after{content:"";position:absolute;width:13px;height:13px;background:#e65d91;border-radius:50%}
.seal:before{left:-6px}.seal:after{top:-6px}
.letter:focus-visible{outline:2px dashed white;outline-offset:9px}
.scene.gathering .letter{animation:none;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.08) rotate(0);transition:left .72s cubic-bezier(.2,.8,.2,1),top .72s cubic-bezier(.2,.8,.2,1),transform .72s cubic-bezier(.2,.8,.2,1),filter .72s}
.scene.gathering{filter:brightness(.88)}
.letter.portal{z-index:10;animation:none;transition:transform 1.5s cubic-bezier(.65,0,.9,.25),filter 1.5s,opacity 1.5s;transform:translate(-50%,-50%) scale(32) rotate(28deg);filter:brightness(1.4);opacity:0}
.dark{position:fixed;z-index:20;inset:0;background:#08060d;opacity:0;pointer-events:none;transition:opacity 1.35s}
body.black .dark{opacity:1}
@media(prefers-reduced-motion:reduce){.star,.letter{animation-duration:12s}}
</style>
</head>
<body>
<main class="scene" id="scene">
 <div class="sky-stars" aria-hidden="true">
  <i class="star big" style="left:8%;top:13%"></i><i class="star" style="left:19%;top:29%;animation-delay:.7s"></i>
  <i class="star dim" style="left:31%;top:12%"></i><i class="star big" style="left:44%;top:22%;animation-delay:1.1s"></i>
  <i class="star" style="left:61%;top:10%;animation-delay:.3s"></i><i class="star dim" style="left:75%;top:27%"></i>
  <i class="star big" style="left:89%;top:15%;animation-delay:1.4s"></i><i class="star" style="left:94%;top:45%"></i>
  <i class="star dim" style="left:10%;top:54%"></i><i class="star big" style="left:23%;top:75%;animation-delay:.8s"></i>
  <i class="star" style="left:39%;top:87%;animation-delay:1.6s"></i><i class="star dim" style="left:54%;top:70%"></i>
  <i class="star big" style="left:72%;top:84%;animation-delay:.4s"></i><i class="star" style="left:86%;top:67%;animation-delay:1s"></i>
  <i class="star dim" style="left:3%;top:88%"></i><i class="star" style="left:51%;top:42%;animation-delay:1.8s"></i>
  <i class="star" style="left:97%;top:91%;animation-delay:.5s"></i><i class="star dim" style="left:6%;top:35%"></i>
 </div>
 <button class="letter" id="letter" aria-label="Abrir carta">
  <span class="envelope"></span><span class="seal"></span>
 </button>
</main>
<div class="dark"></div>
<script>
const scene=document.getElementById('scene');
const letter=document.getElementById('letter');
let opened=false;
letter.addEventListener('click',()=>{
 if(opened)return;
 opened=true;
 scene.classList.add('gathering');
 window.setTimeout(()=>{
   letter.classList.add('portal');
   scene.style.filter='brightness(.55)';
 },760);
 window.setTimeout(()=>document.body.classList.add('black'),1750);
});
</script>
</body>
</html>
