<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8c4dc">
<title>♡</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#f8c4dc}
.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(145deg,#fbddeb 0%,#f7c2dc 48%,#efa9ce 100%);isolation:isolate;transform-origin:center}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px #d77eae35}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:5px;height:5px;background:#fff9fc;box-shadow:0 0 0 2px #fff5;clip-path:polygon(33% 0,66% 0,66% 33%,100% 33%,100% 66%,66% 66%,66% 100%,33% 100%,33% 66%,0 66%,0 33%,33% 33%);animation:twinkle 2.8s steps(2,end) infinite}
.star.large{width:9px;height:9px;background:#fff0b9}
.star.tiny{width:3px;height:3px;box-shadow:0 0 0 1px #fff5}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.letter{position:absolute;z-index:2;left:50%;top:50%;width:108px;height:80px;padding:0;border:0;background:none;cursor:pointer;transform:translate(-50%,-50%);animation:none;will-change:left,top,transform;filter:drop-shadow(0 8px 0 #a64e7b30);-webkit-tap-highlight-color:transparent;perspective:500px}
// Movimiento físico: flota libremente y rebota contra los cuatro bordes.
let opened=false;
let x=window.innerWidth*0.5;
let y=window.innerHeight*0.5;
let vx=112;
let vy=83;
let angle=0;
let last=0;
let animationFrame=0;
const bounds=()=>{
 const halfW=letter.offsetWidth/2;
 const halfH=letter.offsetHeight/2;
 return {minX:halfW+2,maxX:window.innerWidth-halfW-2,minY:halfH+2,maxY:window.innerHeight-halfH-2};
};
function paint(){
 letter.style.left=x+'px';
 letter.style.top=y+'px';
 letter.style.transform='translate(-50%,-50%) rotate('+angle+'deg)';
}
function floatFrame(now){
 if(opened)return;
 const dt=Math.min((now-last)/1000,.035)||0;
 last=now;
 x+=vx*dt;
 y+=vy*dt;
 const b=bounds();
 if(x<b.minX){x=b.minX;vx=Math.abs(vx);}
 else if(x>b.maxX){x=b.maxX;vx=-Math.abs(vx);}
 if(y<b.minY){y=b.minY;vy=Math.abs(vy);}
 else if(y>b.maxY){y=b.maxY;vy=-Math.abs(vy);}
 // Una inclinación suave acompaña el desplazamiento.
 const target=Math.max(-11,Math.min(11,vx/15));
 angle+=(target-angle)*Math.min(1,dt*2.4);
 paint();
 animationFrame=requestAnimationFrame(floatFrame);
}
function startFloating(){
 const b=bounds();
 x=Math.max(b.minX,Math.min(b.maxX,x));
 y=Math.max(b.minY,Math.min(b.maxY,y));
 paint();
 last=performance.now();
 animationFrame=requestAnimationFrame(floatFrame);
}
window.addEventListener('resize',()=>{
 if(opened)return;
 const b=bounds();
 x=Math.max(b.minX,Math.min(b.maxX,x));
 y=Math.max(b.minY,Math.min(b.maxY,y));
 paint();
});
startFloating();
letter.addEventListener('click',()=>{
 if(opened)return;
 opened=true;
 const rect=letter.getBoundingClientRect();
 letter.style.left=(rect.left+rect.width/2)+'px';
 letter.style.top=(rect.top+rect.height/2)+'px';
 letter.classList.add('gather');
 letter.style.animation='none';
 letter.getBoundingClientRect();
 requestAnimationFrame(()=>{
   letter.style.left='50%';
   letter.style.top='50%';
   letter.style.transform='translate(-50%,-50%) scale(1.08) rotate(0deg)';
 });
 window.setTimeout(()=>{
   letter.classList.add('opening');
   warp.classList.add('active');
   scene.style.transition='transform 1.5s cubic-bezier(.5,0,.8,.3),filter 1.5s';
   scene.style.transform='scale(1.12)';
   scene.style.filter='blur(2px) brightness(.72) saturate(1.3)';
 },850);
 window.setTimeout(()=>{
   letter.classList.add('portal');
 },1120);
 window.setTimeout(()=>document.body.classList.add('black'),2350);
});
</script>
</body>
</html>
