<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6a9cf">
<title>Una cartita para ti ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--pink:#f7afd0;--deep:#c95d96;--ink:#713d68;--cream:#fff0f5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Press Start 2P',monospace;background:#f7b6d4;color:var(--ink);image-rendering:pixelated}
.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#f7b8d8 0%,#f9c8df 58%,#f5aaca 100%);transition:filter 1s}
.scene:before,.scene:after{content:"";position:absolute;left:0;right:0;height:18px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 16px,transparent 16px 32px);opacity:.7}
.scene:before{top:0}.scene:after{bottom:0}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:8px;height:8px;background:#fff5fa;box-shadow:0 0 0 4px rgba(255,255,255,.13);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%);animation:twinkle 2.2s steps(2,end) infinite}
.star:nth-child(3n){animation-delay:.7s;transform:scale(.7)}.star:nth-child(4n){background:#fff0a8;animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1;transform:scale(1.35)}}
.cloud{position:absolute;width:110px;height:24px;background:#ffdeeb;opacity:.7;box-shadow:24px -12px 0 -2px #ffdeeb,48px 0 0 #ffdeeb,72px -8px 0 -4px #ffdeeb;animation:drift 24s linear infinite}
.cloud.one{top:19%;left:-150px}.cloud.two{top:68%;left:-200px;animation-delay:-12s;transform:scale(.7)}
@keyframes drift{to{translate:calc(100vw + 400px) 0}}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:2}
.kicker{font-size:9px;letter-spacing:2px;color:#a94d83;margin-bottom:32px;text-shadow:2px 2px #ffe8f2}
h1{font-size:clamp(12px,2.5vw,19px);line-height:2;color:#a94d83;margin:0 0 42px;text-shadow:3px 3px 0 #ffe6f1}
.letter-button{position:relative;width:190px;height:140px;border:0;background:transparent;padding:0;cursor:pointer;outline-offset:12px;filter:drop-shadow(7px 9px 0 rgba(151,65,116,.22));transition:transform .2s steps(3)}
.letter-button:hover{transform:translateY(-7px) scale(1.04)}.letter-button:active{transform:scale(.96)}
.envelope{position:absolute;inset:22px 8px 8px;background:#fff0c9;border:5px solid #b96883;box-shadow:inset 0 -8px #f4c9b9, inset 0 0 0 4px #fff9e8}
.envelope:before{content:"";position:absolute;left:-5px;right:-5px;top:-5px;height:72px;background:#f7d9dd;clip-path:polygon(0 0,100% 0,50% 100%);border-bottom:5px solid #b96883}
.envelope:after{content:"";position:absolute;left:-5px;right:-5px;bottom:-5px;height:75px;background:#f8d9d6;clip-path:polygon(0 100%,50% 15%,100% 100%);border-top:4px solid #c47c91}
.heart{position:absolute;z-index:3;left:50%;top:43%;width:22px;height:22px;background:#ed5d91;transform:translate(-50%,-50%) rotate(45deg);animation:beat 1s steps(2,end) infinite;box-shadow:3px 3px 0 #b94479}
.heart:before,.heart:after{content:"";position:absolute;width:22px;height:22px;background:#ed5d91;border-radius:50%}.heart:before{left:-11px}.heart:after{top:-11px}
@keyframes beat{0%,100%{scale:1}50%{scale:1.22}}
.tap{font-size:8px;margin-top:32px;color:#9c4d7c;line-height:2;animation:hint 1.5s steps(2,end) infinite}
@keyframes hint{50%{opacity:.45}}
.portal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;opacity:0;background:#09060d}
.portal-shape{width:min(46vw,330px);aspect-ratio:1;background:#fff0c9;border:12px solid #b96883;box-shadow:inset 0 0 0 9px #f6c5d6,0 0 0 8px #f8dbe7;clip-path:polygon(20% 0,80% 0,100% 20%,100% 80%,80% 100%,20% 100%,0 80%,0 20%);transform:scale(1) rotate(0deg);position:relative}
.portal-shape:before{content:"";position:absolute;inset:18%;border:9px solid #e66a9b;clip-path:polygon(20% 0,80% 0,100% 20%,100% 80%,80% 100%,20% 100%,0 80%,0 20%);animation:portalspin 1s linear infinite}
.portal-shape:after{content:"";position:absolute;width:30px;height:30px;background:#ed5d91;left:calc(50% - 15px);top:calc(50% - 15px);transform:rotate(45deg);box-shadow:0 0 0 12px rgba(237,93,145,.18)}
@keyframes portalspin{to{transform:rotate(360deg) scale(.8)}}
body.entering .scene{filter:brightness(.3) saturate(.7)}
body.entering .content{animation:pull 1.55s cubic-bezier(.6,0,.8,.2) forwards}
body.entering .portal{opacity:1;animation:portalbg 1.9s steps(8,end) forwards}
body.entering .portal-shape{animation:zoomportal 1.9s cubic-bezier(.65,0,.9,.3) forwards}
@keyframes pull{0%{transform:scale(1);opacity:1}55%{transform:scale(.82);opacity:1}100%{transform:scale(.05);opacity:0}}
@keyframes portalbg{0%,55%{background:rgba(9,6,13,0)}100%{background:#09060d}}
@keyframes zoomportal{0%{transform:scale(.65) rotate(0);opacity:1}55%{transform:scale(1.2) rotate(12deg)}100%{transform:scale(18) rotate(35deg);opacity:0}}
.dark{position:fixed;inset:0;background:#09060d;z-index:20;opacity:0;pointer-events:none;transition:opacity .35s}
body.dark-mode .dark{opacity:1}
@media(max-width:500px){.letter-button{transform:scale(.9)}h1{margin-bottom:30px}.kicker{margin-bottom:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="scene">
  <div class="stars" aria-hidden="true">
    <i class="star" style="left:9%;top:14%"></i><i class="star" style="left:21%;top:32%"></i><i class="star" style="left:78%;top:17%"></i><i class="star" style="left:88%;top:39%"></i><i class="star" style="left:13%;top:76%"></i><i class="star" style="left:72%;top:79%"></i><i class="star" style="left:92%;top:68%"></i><i class="star" style="left:43%;top:11%"></i><i class="star" style="left:58%;top:88%"></i><i class="star" style="left:32%;top:85%"></i><i class="star" style="left:4%;top:49%"></i><i class="star" style="left:96%;top:10%"></i>
  </div>
  <div class="cloud one"></div><div class="cloud two"></div>
  <section class="content">
    <div class="kicker">✦ UN PEQUEÑO DETALLE ✦</div>
    <h1>Hay algo para ti...</h1>
    <button class="letter-button" id="openLetter" aria-label="Abrir la carta">
      <span class="envelope"></span><span class="heart"></span>
    </button>
    <div class="tap">TOCA LA CARTA<br>♡</div>
  </section>
</main>
<div class="portal" aria-hidden="true"><div class="portal-shape"></div></div>
<div class="dark" aria-hidden="true"></div>
<script>
const button=document.getElementById('openLetter');
let opened=false;
button.addEventListener('click',()=>{
  if(opened)return;
  opened=true;
  document.body.classList.add('entering');
  window.setTimeout(()=>{
    document.body.classList.add('dark-mode');
    document.body.classList.remove('entering');
  },1850);
});
</script>
</body>
</html>
